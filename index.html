<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="art" aria-hidden="true"><i></i></div>
    <div class="panel">
      <div class="timer">25:00</div>
      <div class="btns">
        <button class="btn main" id="main-btn" type="button">Start</button>
        <button class="btn alt" id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
